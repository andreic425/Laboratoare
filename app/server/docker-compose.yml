# Baza de date a lucrarii. Se porneste cu: docker compose up -d
services:
  mariadb:
    image: mariadb:11
    container_name: mariadb-tw
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: city_explorer
      MARIADB_USER: web
      MARIADB_PASSWORD: web
    ports:
      - "3306:3306"
    volumes:
      - tw-date:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tw-date: